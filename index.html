<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <title>手勢鋼琴 · Gesture Piano</title>
  <style>
    :root{color-scheme:dark;--bg:#10110f;--panel:#191b18;--panel2:#20231e;--line:#30342e;--text:#f1efe7;--muted:#a2a599;--accent:#d7bd82;--mint:#a8cba9;--danger:#e38f7b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 8% 0%,#303525 0,transparent 38%),radial-gradient(ellipse at 95% 18%,#28271e 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    .shell{width:min(1250px,calc(100% - 44px));margin:0 auto;padding:30px 0 28px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:14px}.mark{width:42px;height:42px;border:1px solid #756c4c;border-radius:14px;display:grid;place-items:center;color:var(--accent);font-size:20px;background:#24241d}.kicker{font-size:10px;letter-spacing:.18em;color:var(--accent);font-weight:750}.brand h1{margin:1px 0 0;font-size:23px;letter-spacing:-.03em}.top-right{display:flex;gap:10px;align-items:center}.tag{border:1px solid var(--line);background:#171914;border-radius:99px;padding:7px 11px;color:var(--muted);font-size:12px}.tag.live{color:var(--mint);border-color:#516850}.layout{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(420px,.82fr);gap:16px;align-items:stretch}.card{background:linear-gradient(145deg,#1b1d19,#171915);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 16px 45px #0002}.camera-card{padding:17px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:1px 2px 14px}.section-label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}.cam-state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#777b70}.cam-state.on .dot{background:var(--mint);box-shadow:0 0 12px #a8cba977}.stage{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#242921,#10120f);border:1px solid #2e322c;display:grid;place-items:center}.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.stage video{display:none}.stage canvas{pointer-events:none}.stage.active video{display:block}.placeholder{z-index:1;color:var(--muted);text-align:center;padding:30px;max-width:360px}.placeholder svg{width:48px;height:48px;color:var(--accent);margin-bottom:10px}.placeholder strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}.stage.active .placeholder{display:none}.camera-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}.button-row{display:flex;gap:9px;align-items:center}.button{border:1px solid var(--line);background:#252820;color:var(--text);border-radius:11px;padding:10px 15px;font:600 13px system-ui,sans-serif;cursor:pointer;transition:background .15s,border .15s,transform .15s}.button:hover{background:#30342b;border-color:#545849;transform:translateY(-1px)}.button.primary{background:var(--accent);border-color:var(--accent);color:#1e1b11}.button.primary:hover{background:#e1cd9d}.button:disabled{opacity:.55;cursor:wait;transform:none}.tip{font-size:11px;color:var(--muted);text-align:right}.right{display:flex;flex-direction:column;gap:14px}.hero{padding:19px 20px 17px;min-height:221px;position:relative}.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.mode-button{border:1px solid #514c39;background:#28271f;color:var(--accent);border-radius:10px;padding:8px 11px;cursor:pointer;font:600 12px system-ui,sans-serif}.mode-button:hover{background:#373326}.current{display:flex;align-items:center;gap:18px;margin-top:18px}.degree{width:92px;height:92px;border-radius:26px;display:grid;place-items:center;background:#29271e;border:1px solid #5a5138;color:var(--accent);font-size:52px;font-weight:750;line-height:1}.degree.idle{color:#55594f;border-color:#363a32;background:#20221d}.chord-name{font-size:34px;font-weight:720;letter-spacing:-.05em;line-height:1.1}.chord-meta{color:var(--muted);margin-top:6px;font-size:13px}.notes{margin-top:13px;color:#d9d7cd;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}.notes .arrow{color:var(--accent);padding:0 5px}.degree-card{padding:14px}.degree-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 9px}.degree-list{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.degree-cell{min-height:59px;border:1px solid #2e322c;border-radius:11px;background:#171915;text-align:center;padding:7px 3px;color:var(--muted);transition:all .12s}.degree-cell b{display:block;font-size:16px;line-height:1.35;color:#d4d1c7}.degree-cell span{font-size:10px}.degree-cell.active{background:#343024;border-color:#8b7850;color:var(--accent);box-shadow:inset 0 0 0 1px #8b785022}.degree-cell.active b{color:#f0d9a5}.keyboard-card{padding:14px 16px 16px}.keyboard-top{display:flex;align-items:center;justify-content:space-between;margin:0 3px 12px}.volume{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px}.volume input{width:95px;accent-color:var(--accent)}.keyboard{height:95px;position:relative;display:flex;user-select:none}.white-key{position:relative;flex:1;background:#e0ded4;border:1px solid #85857c;border-radius:0 0 5px 5px;z-index:1}.white-key:first-child{border-radius:5px 0 5px 5px}.white-key:last-child{border-radius:0 5px 5px 5px}.white-key.active{background:linear-gradient(#ead6a4,#c9a95d)}.white-key small{position:absolute;bottom:4px;left:4px;color:#57574e;font-size:9px}.black-key{position:absolute;top:0;height:61%;width:4.4%;background:linear-gradient(90deg,#151612,#33342f 60%,#161713);border:1px solid #080908;border-radius:0 0 4px 4px;z-index:2;transform:translateX(-50%);box-shadow:0 3px 5px #0008}.black-key.active{background:linear-gradient(#806b40,#493a20)}.foot{margin:15px 4px 0;color:#777b70;font-size:11px;display:flex;justify-content:space-between;gap:12px}.status-message{color:var(--muted);font-size:12px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hidden{display:none!important}
    @media(max-width:920px){.layout{grid-template-columns:1fr}.right{display:grid;grid-template-columns:1fr 1fr}.hero{grid-column:1/-1}.camera-card{min-width:0}.shell{width:min(760px,calc(100% - 28px));padding-top:18px}.degree-list{gap:5px}}
    @media(max-width:620px){.right{display:flex}.topbar{align-items:flex-start}.top-right .tag:first-child{display:none}.camera-tools{align-items:flex-start;flex-direction:column}.tip{text-align:left}.degree-list{grid-template-columns:repeat(4,1fr)}.degree-cell{min-height:52px}.current{gap:13px}.degree{width:76px;height:76px;font-size:43px;border-radius:22px}.chord-name{font-size:29px}.foot{flex-direction:column}.keyboard{height:76px}.black-key{height:58%}.volume input{width:80px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="mark">♫</div><div><div class="kicker">WASM · CAMERA · LIVE MUSIC</div><h1>手勢鋼琴</h1></div></div>
      <div class="top-right"><span class="tag">C 大調</span><span class="tag" id="engineTag">前端即時演奏</span></div>
    </header>

    <section class="layout">
      <article class="card camera-card">
        <div class="card-head"><span class="section-label">CAMERA · 手勢輸入</span><span class="cam-state" id="cameraState"><i class="dot"></i><span>尚未啟動</span></span></div>
        <div class="stage" id="stage">
          <video id="video" playsinline muted></video><canvas id="overlay"></canvas>
          <div class="placeholder"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="12" width="27" height="24" rx="5"/><path d="m32 20 11-6v20l-11-6"/><circle cx="18.5" cy="24" r="5"/></svg><strong>讓手勢成為和弦</strong>啟動鏡頭，比出 1–7 選擇 C 大調級數</div>
          <div class="tag hidden" id="cameraBadge" style="position:absolute;left:12px;top:12px;z-index:3">LIVE</div>
        </div>
        <div class="camera-tools"><div class="button-row"><button class="button primary" id="startButton">啟動相機</button><button class="button hidden" id="stopButton">停止</button></div><div class="tip" id="gestureHint">手掌朝向鏡頭 · 1–7 選和弦 · Q 離開</div></div>
      </article>

      <section class="right">
        <article class="card hero">
          <div class="hero-top"><span class="section-label">CURRENT SOUND · 目前演奏</span><button class="mode-button" id="modeButton">切到電吉他</button></div>
          <div class="current"><div class="degree idle" id="degreeDisplay">—</div><div><div class="chord-name" id="chordDisplay">等待手勢</div><div class="chord-meta" id="chordMeta">保持一個 1–7 手勢開始演奏</div><div class="notes" id="noteDisplay">C 大調 · WASM 手勢辨識</div></div></div>
        </article>

        <article class="card degree-card"><div class="degree-head"><span class="section-label">SCALE DEGREES · C 大調級數</span><span class="section-label" id="instrumentLabel">鋼琴</span></div><div class="degree-list" id="degreeList"></div></article>

        <article class="card keyboard-card"><div class="keyboard-top"><span class="section-label">C4–B5 · 和弦音高亮</span><label class="volume">音量 <input id="volumeSlider" type="range" min="35" max="100" value="88"><span id="volumeValue">88%</span></label></div><div class="keyboard" id="keyboard"></div></article>
      </section>
    </section>

    <footer class="foot"><span id="statusMessage" class="status-message">就緒 · 啟動相機後開始</span><span>手部影像只在本機瀏覽器處理 · Tab 切換音色 · 1–7 鍵可試彈</span></footer>
  </main>
  <script type="module" src="./gesture-piano.js"></script>
</body>
</html>
